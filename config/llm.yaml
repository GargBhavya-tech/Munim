# Fallback chat model (Build Map #34). Any OpenAI-compatible /chat/completions endpoint. The key comes from GEMINI_API_KEY (or FALLBACK_LLM_KEY for another provider).
# Gemini's OpenAI-compatible endpoint is used. With base_url, model and a key all set, the client switches to it after Sarvam fails twice and shows a banner.
# To use another provider, change base_url and model here and put its key in FALLBACK_LLM_KEY (and leave GEMINI_API_KEY empty).
fallback:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-flash-latest
  path: /chat/completions
  temperature: 0.2
  max_tokens: 1024
  timeout_seconds: 60
