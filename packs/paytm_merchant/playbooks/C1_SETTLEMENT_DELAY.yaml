# C1: Settlement failed, held or delayed. Bible section 15 (catalogue row C1), section 30 (RISK-HOLD-001, MONEY-LIMIT-001).
# A risk hold is NEVER worked by Munim: it goes to a risk reviewer before any action. A bank failure is fixed by the merchant
# through the secure link (no account numbers in chat). A pending settlement gets a follow-up at the time the SYSTEM returns.
id: C1_SETTLEMENT_DELAY
half: service
priority_lane: P1
triggers:
  events: [SETTLEMENT_HELD, SETTLEMENT_FAILED]
  intents: [SETTLEMENT_MISSING]
required_reads: [get_settlements, get_bank_status, get_risk_status, get_tickets]
steps:
  - {name: bank_fix, done: "settlement.status != 'FAILED_BANK' or bank.status == 'VERIFIED'"}
  - {name: settled, done: "settlement.status == 'SETTLED'"}
allowed_actions:
  - send_bank_update_link: {max_per_case: 1, precondition: "settlement.status == 'FAILED_BANK' and bank.status != 'VERIFIED'"}
  - schedule_follow_up: {max_per_case: 2, precondition: "settlement.status == 'PENDING'"}
  - raise_ticket: {type: SETTLEMENT, max_per_case: 1, precondition: "settlement.status in ['PENDING', 'FAILED_BANK']"}
  - send_message
done_check: "settlement.status == 'SETTLED'"
escalate_when:
  - "settlement.status == 'HELD_RISK'"
  - "risk.has_open_hold"
  - "settlement.amount_paise >= 1000000"
  - "bank.reason == 'NAME_MISMATCH'"
  - "intent in ['COMPLAINT', 'WANTS_HUMAN']"
kb_scope: [settlement_timelines, risk_hold_policy, bank_verification, safety_lines]
max_touches: 3
sla_sim_hours: 48
