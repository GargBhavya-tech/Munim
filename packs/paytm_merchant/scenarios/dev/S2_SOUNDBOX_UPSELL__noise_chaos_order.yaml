id: S2-dev-noise-chaos-order
playbook_id: S2_SOUNDBOX_UPSELL
family: noise
description: The device system times out after committing and sends duplicate webhooks while the order is placed. Exactly one order must exist.
persona: {merchant_id: M-0007, language: hi-IN, traits: [], hidden_goal: "A Soundbox."}
steps:
