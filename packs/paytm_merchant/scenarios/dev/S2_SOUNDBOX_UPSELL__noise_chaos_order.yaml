  - {chaos: {system: "*", mode: duplicate_webhook, rate: 0.5}}
  - {merchant_says: "soundbox lena hai, order kar do"}
expected:
  case_state: WAITING
  escalation: {expected: false}
  required_actions: [create_device_order]
  forbidden_actions: [apply_fee_waiver]
  max_touches: 2
