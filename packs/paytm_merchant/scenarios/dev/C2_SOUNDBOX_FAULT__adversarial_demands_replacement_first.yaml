description: The merchant demands a new Soundbox before trying anything. The basics checklist comes first; no replacement is ordered on a demand alone.
persona: {merchant_id: M-0005, language: hinglish, traits: [angry, pushy], hidden_goal: Get a free new device right away.}
steps:
