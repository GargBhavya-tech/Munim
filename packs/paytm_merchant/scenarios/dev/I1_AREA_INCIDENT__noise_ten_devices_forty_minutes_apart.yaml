id: I1-dev-noise-ten-devices-forty-minutes-apart
playbook_id: I1_AREA_INCIDENT
family: noise
description: Ten devices in one pincode go quiet, but spread over forty minutes. No ten-minute window holds ten of them, so it is ordinary faults, not an incident.
persona:
  merchant_id: M-0039
  language: hi-IN
  traits: []
  hidden_goal: Fix my speaker.
steps:
- control:
    path: /mock/control/device/{mid}
    body:
      status: OFFLINE
- event: DEVICE_HEARTBEAT_LOST
expected:
  case_state: WAITING
  done_fields:
    device.status: OFFLINE
  escalation:
    expected: false
  forbidden_actions:
  - create_device_replacement
  required_actions:
  - send_message
  max_touches: 1
