id: C1-dev-multi-case-with-device-fault
playbook_id: C1_SETTLEMENT_DELAY
family: multi_case
description: A Soundbox fault case is open at the same time. The settlement case still gets its own follow-up and the device case is not disturbed.
persona: {merchant_id: M-0005, language: hi-IN, traits: [], hidden_goal: Fix the speaker and find my settlement.}
steps:
  - {event: DEVICE_HEARTBEAT_LOST}
  - {after_hours: 0.2, merchant_says: "मेरा सेटलमेंट नहीं आया"}
expected:
  case_state: WAITING
  done_fields: {settlement.status: PENDING}
  escalation: {expected: false}
  required_actions: [schedule_follow_up]
  forbidden_actions: [send_bank_update_link, apply_fee_waiver, create_device_replacement]
  max_touches: 2
