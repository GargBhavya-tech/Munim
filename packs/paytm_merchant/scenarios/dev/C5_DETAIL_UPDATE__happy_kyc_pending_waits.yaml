id: C5-dev-happy-kyc-pending-waits
playbook_id: C5_DETAIL_UPDATE
family: happy
description: KYC is rejected and the bank is pending. Both secure links go out and the case waits for the merchant to complete them.
persona: {merchant_id: M-0006, language: kn-IN, traits: [], hidden_goal: Update my bank and KYC.}
steps:
  - {merchant_says: "bank change karna hai"}
expected:
