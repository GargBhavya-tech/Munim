id: C1-dev-noise-duplicate-webhook-bank-failed
playbook_id: C1_SETTLEMENT_DELAY
family: noise
description: Duplicate webhooks while the bank rejects the credit. The link goes out exactly once even when the merchant asks again a day later.
persona: {merchant_id: M-0001, language: hinglish, traits: [], hidden_goal: Get my money.}
steps:
  - {chaos: {system: "*", mode: duplicate_webhook, rate: 1.0}}
  - {advance_settlement: FAILED_BANK}
  - {after_hours: 25, merchant_says: "settlement nahi aaya"}
  - {after_hours: 0.1, merchant_says: "settlement nahi aaya"}
expected:
  case_state: WAITING
  done_fields: {settlement.status: FAILED_BANK, bank.status: FAILED}
  escalation: {expected: false}
  required_actions: [send_bank_update_link]
  forbidden_actions: [schedule_follow_up, apply_fee_waiver]
  max_touches: 2
