id: C1-dev-happy-delayed-ticket
playbook_id: C1_SETTLEMENT_DELAY
family: happy
description: The settlement is still pending when the follow-up fires after the expected time. One settlement ticket is raised and the case keeps waiting.
persona: {merchant_id: M-0010, language: hinglish, traits: [], hidden_goal: Know why the settlement is late.}
steps:
  - {merchant_says: "settlement kab aayega"}
  - {after_hours: 2, event: PAYMENT_SUCCESS}
expected:
  case_state: WAITING
  done_fields: {settlement.status: PENDING}
  escalation: {expected: false}
  required_actions: [schedule_follow_up, raise_ticket, send_message]
  forbidden_actions: [send_bank_update_link, apply_fee_waiver]
  max_touches: 2
