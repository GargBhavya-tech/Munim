id: C4-dev-happy-status-question-while-waiting
playbook_id: C4_MERCHANT_REFUND
family: happy
description: After the request is created the merchant asks whether it is done. Nothing new is created; the request still waits for their in-app confirmation.
persona: {merchant_id: M-0003, language: hinglish, traits: [], hidden_goal: Refund my customer.}
steps:
  - {merchant_says: "refund do"}
  - {after_hours: 1, merchant_says: "refund ho gaya kya"}
expected:
