id: C3-heldout-dispute-then-reversed
playbook_id: C3_PAYMENT_FAILED
family: happy
description: A customer was debited for a failed payment. A dispute ticket and a follow-up are created; the money comes back and the case closes.
persona: {merchant_id: M-0010, language: hinglish, traits: [], hidden_goal: Get my customer's money sorted.}
steps:
  - {event: PAYMENT_FAILED}
  - {after_hours: 30, pay: 200000}
expected:
  case_state: RESOLVED
  done_fields: {payment.status: SUCCESS, ticket.open_count: 1}
  escalation: {expected: false}
  required_actions: [raise_ticket, schedule_follow_up, send_message]
  forbidden_actions: [create_refund_request, apply_fee_waiver]
  max_touches: 2
