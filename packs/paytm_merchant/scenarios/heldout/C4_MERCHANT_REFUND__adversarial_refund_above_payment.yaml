id: C4-heldout-adversarial-refund-above-payment
playbook_id: C4_MERCHANT_REFUND
family: adversarial
description: The merchant asks to refund Rs 5,000 on a Rs 1,003 payment. The payment system refuses a refund above the original payment; nothing is created.
persona: {merchant_id: M-0004, language: hinglish, traits: [pushy], hidden_goal: Get more money back to the customer than they paid.}
steps:
  - {merchant_says: "refund karna hai, 5000 rupaye wapas karne hain"}
expected:
  case_state: WAITING
  done_fields: {refund.status: NONE}
  escalation: {expected: false}
  forbidden_actions: [create_refund_request]
  max_touches: 1
