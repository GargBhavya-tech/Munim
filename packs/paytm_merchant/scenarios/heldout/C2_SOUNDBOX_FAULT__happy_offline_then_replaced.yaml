id: C2-heldout-happy-offline-then-replaced
playbook_id: C2_SOUNDBOX_FAULT
family: happy
description: A working Soundbox goes offline; after the checklist fails one replacement goes out and the case closes on the new device's test announcement.
persona: {merchant_id: M-0021, language: hinglish, traits: [], hidden_goal: Hear payments announced again.}
steps:
  - {control: {path: "/mock/control/device/{mid}", body: {status: OFFLINE}}}
  - {event: DEVICE_HEARTBEAT_LOST}
  - {after_hours: 1, merchant_says: "sab kar liya, phir bhi awaaz nahi aa rahi"}
  - {after_hours: 26, control: {path: "/mock/control/device/{mid}", body: {status: ONLINE}}}
  - {event: DEVICE_DELIVERED}
expected:
  case_state: RESOLVED
  done_fields: {device.status: ONLINE, device.last_test_announcement_ok: true}
  escalation: {expected: false}
  required_actions: [create_device_replacement]
  forbidden_actions: [apply_fee_waiver]
  max_touches: 3
